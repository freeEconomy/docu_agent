services:
  documind:
    build: .
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      RAG_API_KEY: ${RAG_API_KEY:-}
      RAG_MODEL: ${RAG_MODEL:-gpt-4o-mini}
    volumes:
      - documind-data:/app/data
    restart: unless-stopped
volumes:
  documind-data:
